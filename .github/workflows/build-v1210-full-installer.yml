name: Build GTA IV Scaling v1.2.10 full standalone installer

on:
  push:
    branches:
      - release/v1.2.10-standalone
      - fix/v1.2.10-reshade-cursor
      - fix/v1.2.10-reshade-render-scale-mouse
    paths:
      - 'installer/GTAIV-Scaling-Setup-v1.2.10.iss'
      - 'installer/Run-Scaling-Action-v1.2.10.ps1'
      - 'install/Install-DLAA-v1.2.10.bat'
      - 'install/core/Install-DLAA-Core-v1.2.10.bat'
      - 'install/Uninstall-DLAA.bat'
      - 'README.md'
      - 'docs/RESHade-INPUT-PATCH.md'
      - 'tools/reshade-bbridge-input/INSTALL.bat'
      - 'tools/reshade-bbridge-input/README.md'
      - 'tools/reshade-bbridge-input/apply_patch.ps1'
      - '.github/workflows/build-v1210-full-installer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-full-installer:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out selected working baseline
        uses: actions/checkout@v4

      - name: Download the exact runtime and ReShade artifacts used by the working baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path '_runtime-artifact' -Force | Out-Null
          New-Item -ItemType Directory -Path '_reshade-artifact' -Force | Out-Null

          gh run download 42619124189 --repo "$env:GITHUB_REPOSITORY" --name 'cleaned-prebuilt-runtime' --dir '_runtime-artifact'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned cleaned-prebuilt-runtime artifact.' }

          gh run download 42649783447 --repo "$env:GITHUB_REPOSITORY" --name 'prebuilt-reshade' --dir '_reshade-artifact'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned prebuilt-reshade artifact.' }

      - name: Verify runtime, bridge client, viewport presenter and ReShade input patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedRuntime = 'E69D0F764117DEA1559CC45003D48CF7B19E05AC343E8B7618BD21FD573D6419'
          $expectedReShade = 'DE654100E1BE5250DCAFBF5FD921F29BA2E0DD0BDAB1623BE0BB00062EA47906'
          $expectedFeeder = 'D4125D1E0D9F28877D71FC58311E9C3A23A2F080D16E0E9E7D465A6E4B497648'

          $runtimeZip = Resolve-Path '.\_runtime-artifact\GTAIV-DLSS-Full-Runtime.zip'
          $runtimeShaFile = '.\_runtime-artifact\GTAIV-DLSS-Full-Runtime.sha256'
          $runtimeRecorded = (Get-Content -LiteralPath $runtimeShaFile -Raw).Trim().Split(' ')[0].ToUpperInvariant()
          $runtimeActual = (Get-FileHash -LiteralPath $runtimeZip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($runtimeRecorded -ne $expectedRuntime -or $runtimeActual -ne $expectedRuntime) {
            throw "Pinned runtime SHA-256 mismatch. Recorded=$runtimeRecorded Actual=$runtimeActual"
          }

          $reshadeDll = Resolve-Path '.\_reshade-artifact\ReShade64-bbridge.dll'
          $reshadeShaFile = '.\_reshade-artifact\ReShade64-bbridge.sha256'
          $reshadeRecorded = (Get-Content -LiteralPath $reshadeShaFile -Raw).Trim().Split(' ')[0].ToUpperInvariant()
          $reshadeActual = (Get-FileHash -LiteralPath $reshadeDll -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($reshadeRecorded -ne $expectedReShade -or $reshadeActual -ne $expectedReShade) {
            throw "Pinned ReShade input-patch SHA-256 mismatch. Recorded=$reshadeRecorded Actual=$reshadeActual"
          }

          $runtimeDir = '.\_runtime-expanded'
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtimeDir -Force
          $manifest = Join-Path $runtimeDir 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Runtime SHA256SUMS.txt is missing.' }

          $verified = 0
          foreach ($line in Get-Content -LiteralPath $manifest) {
            if ($line -match '^(?<hash>[0-9A-Fa-f]{64})\s{2}(?<path>.+)$') {
              $expected = $Matches['hash'].ToUpperInvariant()
              $relative = $Matches['path'].Replace('/', '\')
              $file = Join-Path $runtimeDir $relative
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Runtime file missing: $relative" }
              $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToUpperInvariant()
              if ($actual -ne $expected) { throw "Runtime file hash mismatch: $relative" }
              $verified++
            }
          }
          if ($verified -ne 17) { throw "Expected 17 manifest entries, verified $verified." }

          $feeder = (Get-FileHash (Join-Path $runtimeDir 'dlss5-feed.addon64') -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($feeder -ne $expectedFeeder) { throw "Feeder hash mismatch: $feeder" }

          $clientText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $runtimeDir 'd3d9.dll')))
          foreach ($marker in @('M3K-DI-KEY','M3K-BBRIDGE-RELAY-ACK-HOOK','M3K-BRIDGE-INPUT-TRACE','M3K-BRIDGE-MOUSE-BOUNDS-REFRESH','M3K-STEAM-INPUT')) {
            if (-not $clientText.Contains($marker)) { throw "Working b-bridge marker missing from d3d9.dll: $marker" }
          }

          $presenterText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $runtimeDir 'd3d9vk_x64.dll')))
          if (-not $presenterText.Contains('M3K-VIEWPORT-RT')) { throw 'Verified viewport/presenter marker missing.' }

          $reshadeText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($reshadeDll))
          if (-not $reshadeText.ToLowerInvariant().Contains('b-bridge input relay')) { throw 'ReShade input-relay marker missing.' }
          $reshadeBytes = [IO.File]::ReadAllBytes($reshadeDll)
          $wide0 = [Text.Encoding]::Unicode.GetString($reshadeBytes)
          $wide1 = [Text.Encoding]::Unicode.GetString($reshadeBytes, 1, $reshadeBytes.Length - 1)
          if (-not ($wide0.Contains('m3k-nr.ini') -or $wide1.Contains('m3k-nr.ini'))) {
            throw 'Scale-aware ReShade GUI patch marker missing from the DLL.'
          }

          Write-Host "Verified runtime: $runtimeActual"
          Write-Host "Verified ReShade patch: $reshadeActual"
          Write-Host "Verified runtime manifest entries: $verified"

      - name: Assemble installer payload and pin the runtime hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = '.\installer\payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null

          Copy-Item '.\_runtime-artifact\GTAIV-DLSS-Full-Runtime.zip' (Join-Path $payload 'GTAIV-Scaling-Runtime-v1.2.10.zip') -Force
          Copy-Item '.\_reshade-artifact\ReShade64-bbridge.dll' (Join-Path $payload 'ReShade64-bbridge.dll') -Force

          $action = [IO.File]::ReadAllText('.\installer\Run-Scaling-Action-v1.2.10.ps1')
          $action = $action.Replace('__SCALING_RUNTIME_SHA256__','E69D0F764117DEA1559CC45003D48CF7B19E05AC343E8B7618BD21FD573D6419')
          $action = $action.Replace('__SCALING_FEEDER_SHA256__','D4125D1E0D9F28877D71FC58311E9C3A23A2F080D16E0E9E7D465A6E4B497648')
          if ($action.Contains('__SCALING_RUNTIME_SHA256__') -or $action.Contains('__SCALING_FEEDER_SHA256__')) {
            throw 'A runtime hash placeholder was not replaced.'
          }
          if ($action -match '(?i)VK_END|EndToHome|SyntheticHome|SendInput.{0,80}VK_HOME') {
            throw 'An End-key/Synthetic-Home experiment leaked into the 1.2.10 baseline package.'
          }
          [IO.File]::WriteAllText((Join-Path $payload 'Run-Scaling-Action-v1.2.10.ps1'),$action,[Text.UTF8Encoding]::new($false))

          $core = [IO.File]::ReadAllText('.\install\core\Install-DLAA-Core-v1.2.10.bat')
          $runtimePin = '$RuntimeZipHash=' + "'" + 'E69D0F764117DEA1559CC45003D48CF7B19E05AC343E8B7618BD21FD573D6419' + "'"
          if (-not $core.Contains($runtimePin)) { throw 'Clean-install foundation does not pin the 1.2.10 runtime archive.' }

          $foundation = [IO.File]::ReadAllText('.\install\Install-DLAA-v1.2.10.bat')
          if (-not $foundation.Contains('DE654100E1BE5250DCAFBF5FD921F29BA2E0DD0BDAB1623BE0BB00062EA47906')) {
            throw 'Foundation installer does not pin the matching ReShade input patch.'
          }

          $coreHashTable = [regex]::Match($core,'(?s)\$RuntimeHashes=@\{.*?\n\}')
          if (-not $coreHashTable.Success) { throw 'Clean-install runtime file hash table is missing.' }
          $manifestText = Get-Content (Join-Path '_runtime-expanded' 'SHA256SUMS.txt') -Raw
          foreach ($line in ($manifestText -split '\r?\n')) {
            if ($line -match '^(?<hash>[0-9A-Fa-f]{64})\s{2}(?<path>.+)$') {
              $expectedFileHash = $Matches['hash'].ToUpperInvariant()
              $rel = $Matches['path'].Replace('/','\')
              $pattern = "'" + [regex]::Escape($rel) + "'='([0-9A-Fa-f]{64})';"
              $match = [regex]::Match($coreHashTable.Value,$pattern)
              if (-not $match.Success -or $match.Groups[1].Value.ToUpperInvariant() -ne $expectedFileHash) {
                throw "Foundation script runtime pin does not match manifest: $rel"
              }
            }
          }

      - name: Validate PowerShell components and baseline-only key behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-PowerShell([string]$Name,[string]$Text) {
            try { [void][ScriptBlock]::Create($Text) }
            catch { throw "$Name PowerShell parse failed: $($_.Exception.Message)" }
          }
          function Assert-EmbeddedPowerShell([string]$Path) {
            $text = [IO.File]::ReadAllText($Path)
            $marker = '#==POWERSHELL==#'
            $i = $text.IndexOf($marker)
            if ($i -lt 0) { throw "Embedded PowerShell marker missing: $Path" }
            Assert-PowerShell $Path $text.Substring($i + $marker.Length)
          }

          Assert-PowerShell 'Run-Scaling-Action-v1.2.10.ps1' ([IO.File]::ReadAllText('.\installer\payload\Run-Scaling-Action-v1.2.10.ps1'))
          Assert-PowerShell 'Update-NR.ps1' ([IO.File]::ReadAllText('.\installer\Update-NR.ps1'))
          Assert-PowerShell 'Install-Latest-FusionFix.ps1' ([IO.File]::ReadAllText('.\installer\Install-Latest-FusionFix.ps1'))
          Assert-EmbeddedPowerShell '.\install\Install-DLAA-v1.2.10.bat'
          Assert-EmbeddedPowerShell '.\install\core\Install-DLAA-Core-v1.2.10.bat'
          Assert-EmbeddedPowerShell '.\install\Uninstall-DLAA.bat'

          $iss = [IO.File]::ReadAllText('.\installer\GTAIV-Scaling-Setup-v1.2.10.iss')
          foreach ($required in @('GTAIV-Scaling-Runtime-v1.2.10.zip','Run-Scaling-Action.ps1','Install-DLAA-Core.bat','ReShade64-bbridge.dll')) {
            if (-not $iss.Contains($required)) { throw "Inno Setup definition is missing: $required" }
          }
          if ($iss.Contains('Use End as alternate') -or $iss.Contains('Social Club key')) {
            throw 'The full installer must not expose the abandoned End-key experiment.'
          }

          $action = [IO.File]::ReadAllText('.\installer\payload\Run-Scaling-Action-v1.2.10.ps1')
          if (-not $action.Contains('Set-Ini $path ''INPUT'' ''KeyOverlay'' ''46,0,0,0''')) {
            throw 'Install / Repair must configure ReShade KeyOverlay to VK_DELETE (46).'
          }
          if (-not $action.Contains('Set-ReShadeOverlayShortcut $Root') -or -not $action.Contains("'.trex\ReShade.ini'")) {
            throw 'The Delete shortcut must be applied and the previous ReShade.ini backed up.'
          }
          if ($iss.Contains('Home opens ReShade') -or $iss.Contains('press Home')) {
            throw 'Installer UI still advertises Home as the ReShade shortcut.'
          }
          if (-not $iss.Contains('Delete opens ReShade') -or -not $iss.Contains('press Delete')) {
            throw 'Installer UI must advertise Delete as the ReShade shortcut.'
          }

          $core = [IO.File]::ReadAllText('.\install\core\Install-DLAA-Core-v1.2.10.bat')
          if (-not $core.Contains('Set-IniValue $rsIni ''INPUT'' ''KeyOverlay'' ''46,0,0,0''')) {
            throw 'Fresh foundation installs must also configure ReShade KeyOverlay to Delete.'
          }
          Write-Host 'PowerShell components parse and the Inno package references the Delete-key shortcut consistently.'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Compile complete standalone installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'ISCC.exe was not found.' }
          & $compiler '.\installer\GTAIV-Scaling-Setup-v1.2.10.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }

          $exe = '.\installer\out-v1210\GTAIV-Scaling-Setup-v1.2.10-Render-Scale-Mouse-Test.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Compiled standalone installer is missing.' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          $hash | Set-Content '.\installer\out-v1210\GTAIV-Scaling-Setup-v1.2.10-Render-Scale-Mouse-Test.sha256' -Encoding ASCII
          Write-Host "GTAIV-Scaling-Setup-v1.2.10-Render-Scale-Mouse-Test.exe SHA-256: $hash"

      - name: Upload full standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: GTAIV-Scaling-v1.2.10-Render-Scale-Mouse-Test
          path: |
            installer/out-v1210/GTAIV-Scaling-Setup-v1.2.10-Render-Scale-Mouse-Test.exe
            installer/out-v1210/GTAIV-Scaling-Setup-v1.2.10-Render-Scale-Mouse-Test.sha256
          retention-days: 90
