name: GTA IV Scaling v1.2.4 aspect-ratio installer
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release-v1.2.3-aspect-ratio.yml']
  push:
    branches: [main, fix/v1.2.3-aspect-ratio, fix/v1.2.3-runtime-file-hashes]
    paths: ['.github/workflows/release-v1.2.3-aspect-ratio.yml']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch hash-pinned old runtime and input patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory .\_base -Force|Out-Null
          gh release download v1.2.2 --repo "$env:GITHUB_REPOSITORY" --pattern GTAIV-Scaling-Runtime-v1.2.2.zip --dir .\_base --clobber
          if($LASTEXITCODE-ne0){throw 'Runtime download failed'}
          gh release download v1.1.0 --repo "$env:GITHUB_REPOSITORY" --pattern ReShade64-bbridge.dll --dir .\_base --clobber
          if($LASTEXITCODE-ne0){throw 'ReShade download failed'}
          $hash=(Get-FileHash .\_base\GTAIV-Scaling-Runtime-v1.2.2.zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if($hash-ne'DEDC0BCC7D1608B5C5016E9DCED73FFA97C3E7676B587DEFC7A1D1C2FF2867E2'){throw 'Wrong v1.2.2 runtime'}
          $hash=(Get-FileHash .\_base\ReShade64-bbridge.dll -Algorithm SHA256).Hash.ToUpperInvariant()
          if($hash-ne'D5BD8CB2B6E935506888EA71711361B9AFCD72ED7C70926C0F52E8F8E47C7510'){throw 'Wrong ReShade patch'}
      - name: Patch runtime configuration only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive .\_base\GTAIV-Scaling-Runtime-v1.2.2.zip .\_runtime123 -Force
          $cfg='.\_runtime123\dxvk.conf'
          $src=[IO.File]::ReadAllText($cfg)
          $pat='(?im)^[ \t]*d3d9\.forceAspectRatio[ \t]*=[^\r\n]*(?:\r?\n|$)'
          if(-not([regex]::IsMatch($src,$pat))){throw 'Legacy filter missing from v1.2.2; inspect input'}
          $out=[regex]::Replace($src,$pat,'')
          if([regex]::IsMatch($out,'(?im)^[ \t]*d3d9\.forceAspectRatio[ \t]*=')){throw 'Filter not removed'}
          if(-not([regex]::IsMatch($out,'(?im)^[ \t]*d3d9\.modeCountCompatibility[ \t]*=[ \t]*(true|1)\b'))){throw 'Safe mode-count option missing'}
          [IO.File]::WriteAllText($cfg,$out,[Text.UTF8Encoding]::new($false))
          'GTA IV Scaling 1.2.4: v1.2.2 binaries, DXVK aspect fix'|Set-Content .\_runtime123\GTAIV-SCALING-VERSION.txt
          $root=(Resolve-Path .\_runtime123).Path
          Get-ChildItem .\_runtime123 -Recurse -File | Where-Object {$_.Name-ne'SHA256SUMS.txt'} | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash+'  '+$_.FullName.Substring($root.Length+1)
          }|Set-Content .\_runtime123\SHA256SUMS.txt -Encoding ASCII
          New-Item -ItemType Directory .\installer\payload -Force|Out-Null
          Compress-Archive .\_runtime123\* .\installer\payload\GTAIV-Scaling-Runtime-v1.2.4.zip -CompressionLevel Optimal
          Copy-Item .\_base\ReShade64-bbridge.dll .\installer\payload\ReShade64-bbridge.dll
          $fh=(Get-FileHash .\_runtime123\dlss5-feed.addon64 -Algorithm SHA256).Hash.ToUpperInvariant()
          if($fh-ne'CEB478CC9409F1C284E4A702EFE5FFF9E3B2E4EB070315934D308C82F964DA50'){throw 'Feeder changed'}
          "FEEDER_HASH=$fh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $rh=(Get-FileHash .\installer\payload\GTAIV-Scaling-Runtime-v1.2.4.zip -Algorithm SHA256).Hash.ToUpperInvariant()
          "RUNTIME_HASH=$rh"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $rh|Set-Content .\installer\payload\GTAIV-Scaling-Runtime-v1.2.4.sha256 -Encoding ASCII
      - name: Rehash setup scripts and regression check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $core=[IO.File]::ReadAllText('.\install\core\Install-DLAA-Core.bat')
          $oldR='A0796FA04DFACEC7997B08BEFE1933EFBB17D2BC62478CB41B8C89750674CEE3'
          $oldF='B6D7D9B050C4F32642A528E7700F38A0510795C7D61D30665DC96AF270B9ED27'
          if(-not $core.Contains($oldR) -or -not $core.Contains($oldF)){throw 'Missing foundation hash anchors'}
          # v1.2.4 patches dxvk.conf and can contain newer runtime DLLs than
          # the foundation script was originally pinned against. Derive EVERY
          # per-file SHA256 from the exact runtime ZIP that is being bundled.
          $core=$core.Replace($oldR,$env:RUNTIME_HASH).Replace($oldF,$env:FEEDER_HASH).Replace('GTAIV-DLSS-Setup.exe','GTAIV-Scaling-Setup-v1.2.4.exe')
          $hashBlock=[regex]::Match($core,'(?s)\$RuntimeHashes=@\{(.*?)\}')
          if(-not $hashBlock.Success){throw 'Foundation runtime hash table missing'}
          $entryPattern="(?m)^[ \t]*'([^']+)'[ \t]*=[ \t]*'([0-9A-Fa-f]{64})'[ \t]*;?[ \t]*\r?$"
          $entries=[regex]::Matches($hashBlock.Groups[1].Value,$entryPattern)
          if($entries.Count-lt10){throw "Incomplete foundation hash table: $($entries.Count) entries"}
          foreach($entry in $entries){
            $rel=$entry.Groups[1].Value
            $runtimeFile=Join-Path '.\_runtime123' $rel
            if(-not(Test-Path -LiteralPath $runtimeFile -PathType Leaf)){throw "Foundation runtime file missing: $rel"}
            $actual=(Get-FileHash -LiteralPath $runtimeFile -Algorithm SHA256).Hash.ToUpperInvariant()
            $core=$core.Replace($entry.Value,$entry.Value.Replace($entry.Groups[2].Value,$actual))
          }
          $foundationPath='.\installer\payload\Install-DLAA-Core-v1.2.4.bat'
          [IO.File]::WriteAllText($foundationPath,$core,[Text.UTF8Encoding]::new($false))
          # Fail the release build before shipping if any embedded hash does not
          # match the packaged file (the previous build missed dxvk.conf here).
          $pinnedBlock=[regex]::Match([IO.File]::ReadAllText($foundationPath),'(?s)\$RuntimeHashes=@\{(.*?)\}')
          if(-not $pinnedBlock.Success){throw 'Generated foundation hash table missing'}
          $pinnedEntries=[regex]::Matches($pinnedBlock.Groups[1].Value,$entryPattern)
          if($pinnedEntries.Count-ne$entries.Count){throw 'Generated foundation hash count changed'}
          foreach($entry in $pinnedEntries){
            $rel=$entry.Groups[1].Value
            $actual=(Get-FileHash -LiteralPath (Join-Path '.\_runtime123' $rel) -Algorithm SHA256).Hash.ToUpperInvariant()
            if($entry.Groups[2].Value.ToUpperInvariant()-ne$actual){throw "Generated foundation SHA256 mismatch: $rel"}
          }
          Write-Host "PASS: all $($pinnedEntries.Count) foundation SHA256 values match the bundled runtime"
          $runner=[IO.File]::ReadAllText('.\installer\Run-Scaling-Action.ps1')
          foreach($marker in @('__SCALING_RUNTIME_SHA256__','__SCALING_FEEDER_SHA256__','Repair-V122AspectRatio','Remove-DxvkForcedAspectRatio')){
            if(-not $runner.Contains($marker)){throw "Missing marker $marker"}
          }
          $runner=$runner.Replace('__SCALING_RUNTIME_SHA256__',$env:RUNTIME_HASH).Replace('__SCALING_FEEDER_SHA256__',$env:FEEDER_HASH)
          [IO.File]::WriteAllText('.\installer\Run-Scaling-Action.ps1',$runner,[Text.UTF8Encoding]::new($false))
          [void][ScriptBlock]::Create($runner)
          foreach($bat in @('.\install\Install-DLAA.bat','.\installer\payload\Install-DLAA-Core-v1.2.4.bat','.\install\Uninstall-DLAA.bat')){
            $str=[IO.File]::ReadAllText($bat);$a=$str.IndexOf('#==POWERSHELL==#')
            if($a-ge0){[void][ScriptBlock]::Create($str.Substring($a+16))}
          }
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseInput($runner,[ref]$tokens,[ref]$errors)
          if($errors.Count){throw "PowerShell syntax error: $($errors[0].Message)"}
          foreach($name in @('Remove-DxvkForcedAspectRatio','Repair-V122AspectRatio')){
            $fn=$ast.Find({param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name},$true)
            if(-not $fn){throw "Missing function $name"}
            Invoke-Expression $fn.Extent.Text
          }
          function Test-Foundation([string]$Root){return $true}
          $demo=Join-Path $env:RUNNER_TEMP 'v122-aspect-upgrade'
          New-Item -ItemType Directory (Join-Path $demo '.trex') -Force|Out-Null
          @('# keep comment: d3d9.forceAspectRatio = 16:9','d3d9.modeCountCompatibility = True','d3d9.forceAspectRatio = 16:9')|Set-Content (Join-Path $demo 'dxvk.conf')
          'FSRScalePermille=667'|Set-Content (Join-Path $demo '.trex\m3k-nr.ini')
          @('GTA IV Scaling','Version=1.2.2')|Set-Content (Join-Path $demo 'GTAIV_SCALING_INSTALLED.txt')
          if(-not(Repair-V122AspectRatio $demo)){throw 'v1.2.2 repair skipped'}
          $cfg=[IO.File]::ReadAllText((Join-Path $demo 'dxvk.conf'))
          if([regex]::IsMatch($cfg,'(?im)^[ \t]*d3d9\.forceAspectRatio[ \t]*=')){throw 'Forced ratio persisted'}
          if(-not $cfg.Contains('d3d9.modeCountCompatibility = True')){throw 'Mode-count protection lost'}
          if((Get-Content (Join-Path $demo '.trex\m3k-nr.ini') -Raw)-notmatch 'FSRScalePermille=667'){throw 'FSR settings modified'}
          if((Get-Content (Join-Path $demo 'GTAIV_SCALING_INSTALLED.txt') -Raw)-notmatch 'Version=1.2.4'){throw 'Receipt not updated'}
          Write-Host 'PASS: legacy 1.2.2 fast repair'
      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup --no-progress -y
          if($LASTEXITCODE-ne0){throw 'Inno Setup install failed'}
          $iscc=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $iscc)){throw 'ISCC missing'}
          & $iscc .\installer\GTAIV-Scaling-Setup.iss
          if($LASTEXITCODE-ne0){throw 'Inno compile failed'}
          $exe='.\installer\out\GTAIV-Scaling-Setup-v1.2.4.exe'
          if(-not(Test-Path $exe)){throw 'Installer absent'}
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToUpperInvariant() | Set-Content .\installer\out\GTAIV-Scaling-Setup-v1.2.4.sha256 -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: GTAIV-Scaling-v1.2.4-installer
          if-no-files-found: error
          path: |
            installer/out/GTAIV-Scaling-Setup-v1.2.4.exe
            installer/out/GTAIV-Scaling-Setup-v1.2.4.sha256
            installer/payload/GTAIV-Scaling-Runtime-v1.2.4.zip
            installer/payload/GTAIV-Scaling-Runtime-v1.2.4.sha256
      - name: Publish verified v1.2.4
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release view v1.2.4 --repo "$env:GITHUB_REPOSITORY" *> $null
          if($LASTEXITCODE-eq0){throw 'v1.2.4 already exists'}
          $assets=@('.\installer\out\GTAIV-Scaling-Setup-v1.2.4.exe','.\installer\out\GTAIV-Scaling-Setup-v1.2.4.sha256','.\installer\payload\GTAIV-Scaling-Runtime-v1.2.4.zip','.\installer\payload\GTAIV-Scaling-Runtime-v1.2.4.sha256')
          gh release create v1.2.4 $assets --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "GTA IV Scaling v1.2.4 aspect-ratio hotfix" --notes-file .\RELEASE-v1.2.4.md --latest
          if($LASTEXITCODE-ne0){throw 'Release upload failed'}
